
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Consulta el tiempo actual de cualquier ciudad con MeteoLocal."
    >

    <meta name="theme-color" content="#2c2c2c">

    <title>MeteoLocal | Consulta el tiempo</title>

</head>

<body>

    <header>
        <nav aria-label="Navegación principal">

            <div class="contenedor-titulo">
                <img id="logo-web" src="" alt="MeteoLocal">
                <h1>METEO<span class="local">LOCAL</span></h1>
            </div>

            <div class="contenedor-buscador">
                <div class="barra-buscadora">
                    <label for="input-ciudad" class="visually-hidden"></label>
                    <input id="input-ciudad" type="text" placeholder="Buscar ciudad" autocomplete="off">
                    <img id="buscar-ciudad" src="" alt="Buscar" role="button" tabindex="0">
                </div>

                <div class="resultados-busqueda"></div>
            </div>

            <div class="cambiar-unidades" aria-label="Unidades de temperatura">
                <button id="celsius" class="grados" type="button"
                    aria-label="Mostrar temperatura en grados Celsius"
                    aria-pressed="true">
                    °C
                </button>

                <button id="fahrenheit" class="grados" type="button"
                    aria-label="Mostrar temperatura en grados Fahrenheit"
                    aria-pressed="false">
                    °F
                </button>
            </div>

        </nav>
    </header>

    <main>

        <section
            class="contenedor-info-tiempo"
            aria-label="Tiempo actual"
        >
            <div class="info-tiempo" aria-live="polite">

            </div>
        </section>

        <section
            class="seccion-prevision"
            aria-labelledby="titulo-prevision"
        >
            <h2 id="titulo-prevision" class="titulo-prevision">
                PREVISIÓN DE LOS PRÓXIMOS DÍAS
            </h2>

            <div class="prevision">

            </div>
        </section>

    </main>

    <footer>
        <p>Copyright © 2026 Samuel-96</p>

        <a
            href="https://github.com/Samuel-96"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitar mi perfil de GitHub (se abre en una nueva pestaña)"
        >
            <img
                class="git-logo"
                src="./assets/github-logo.png"
                alt="github logo"
            >
        </a>
    </footer>

    <div
        class="loader"
        role="status"
        aria-label="Cargando información meteorológica"
    ></div>

    <div id="overlay" aria-hidden="true"></div>

    <div
        class="ventana-error"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="mensaje-error"
    >
        <h2 id="mensaje-error" class="mensaje">
            No se ha encontrado la ciudad introducida
        </h2>

        <button class="cerrar-ventana" type="button">
            Cerrar
        </button>
    </div>

</body>
</html>
